# the hooks of .pre-commit-config.yaml on every file of a pull request's tree
name: pre-commit

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PRE_COMMIT_VERSION: 4.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # the golangci-lint the Makefile pins for the golangci-lint hook (make lint)
      - name: Install golangci-lint and pre-commit
        run: |
          version="$(sed -n -E 's/^GOLANGCI_LINT_VERSION \?= (v[0-9.]+)$/\1/p' Makefile)"
          [ -n "$version" ] || { echo "::error::no GOLANGCI_LINT_VERSION in the Makefile"; exit 1; }
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$version"
          pipx install "pre-commit==$PRE_COMMIT_VERSION"
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.PRE_COMMIT_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure --color always
