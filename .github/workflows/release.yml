# SPDX-License-Identifier: AGPL-3.0-only

# a pushed v* tag: make release, build provenance for both tarballs, then the GitHub release with the tarballs and
# SHA256SUMS; the tag must be what tools/release/version.sh prints for its commit, see docs/development.md
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

# a release runs to the end, a second push of the same tag waits for it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
      id-token: write # the OIDC token Sigstore signs the provenance with
      attestations: write # actions/attest-build-provenance stores the attestations
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # the full history and the tags, git describe counts from them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make install-go-licenses
      - name: Check the tag
        run: |
          version="$(./tools/release/version.sh)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::the tag is $TAG but tools/release/version.sh prints $version for its commit, nothing is released"
            exit 1
          fi
      - run: make release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/decerter_${{ github.ref_name }}_linux_amd64.tar.gz
            dist/decerter_${{ github.ref_name }}_linux_arm64.tar.gz
      # the notes are the message of an annotated tag without its signature, generated by GitHub for a lightweight tag or an empty message
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          if [ "${object%% *}" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${object#* }" --jq .message | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d; /^-----BEGIN SSH SIGNATURE-----$/,$d' > "$notes"
          fi
          arguments=(--verify-tag --title "decerter $TAG")
          if grep -q '[^[:space:]]' "$notes"; then
            arguments+=(--notes-file "$notes")
          else
            arguments+=(--generate-notes)
          fi
          case "$TAG" in
          *-*)
            arguments+=(--prerelease)
            ;;
          esac
          gh release create "$TAG" "${arguments[@]}" "dist/decerter_${TAG}_linux_amd64.tar.gz" "dist/decerter_${TAG}_linux_arm64.tar.gz" dist/SHA256SUMS
